<body>
<header><b>Freddy Free Coder</b><button id="bNew">New</button><button id="bSn">Saved</button><button id="bLog">Log</button><button id="bSet">Keys</button><button id="bBg" title="Background">BG</button><div id="status"></div></header>
<div id="projectbar"><span id="projectName">Default project</span><button id="bMenu" type="button">Menu</button><div class="drawer-btns"><button id="bProjects">Projects</button><button id="bFiles">Files</button><button id="bMemory">Memory</button></div></div>
<div id="msgs"></div>
<div id="bar"><button id="bAttach" type="button" title="Attach photo or file">＋</button><textarea id="inp" rows="1" placeholder="Describe what to build or fix…"></textarea><button class="p" id="bSend">Send</button><p id="attachHint" class="note" hidden></p><input id="quickAttach" type="file" multiple accept="image/*,.html,.htm,.css,.js,.json,.md,.txt,.svg,text/*" style="display:none"></div>
<script>
const $=s=>document.querySelector(s);
function h(t,a={},...c){const e=document.createElement(t);for(const k in a){if(k.startsWith('on'))e[k]=a[k];else if(k==='class')e.className=a[k];else e[k]=a[k]}c.flat().forEach(x=>e.append(x));return e}
function load(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v||d}catch(e){return d}}
const DEF={sys:"You are an expert coding assistant. Prefer complete, runnable single-file web apps. Always put FULL file contents in fenced code blocks labeled with the exact filename (example: ```index.html). Never use a bare ```html label. Be concise. For UI apps: ALWAYS force a dark theme (dark background + light text); never use prefers-color-scheme light styles that switch to a light UI. Keep selected controls visually highlighted. Recalculate live when inputs change (do not clear results when the user edits a related field).",mode:'sticky',cur:0,last:null,providers:[
 {id:'gemini',name:'Gemini',type:'gemini',url:'https://generativelanguage.googleapis.com/v1beta',model:'gemini-flash-lite-latest',key:'',on:true},
 {id:'groq',name:'Groq',type:'openai',url:'https://api.groq.com/openai/v1',model:'openai/gpt-oss-20b',key:'',on:true},
 {id:'openrouter',name:'OpenRouter',type:'openai',url:'https://openrouter.ai/api/v1',model:'openrouter/free',key:'',on:true},
 {id:'cerebras',name:'Cerebras',type:'openai',url:'https://api.cerebras.ai/v1',model:'llama-3.3-70b',key:'',on:true},
 {id:'mistral',name:'Mistral',type:'openai',url:'https://api.mistral.ai/v1',model:'mistral-small-latest',key:'',on:true}]};
let cfg=load('fc.cfg',DEF),chat=load('fc.chat',[]),cool=load('fc.cool',{}),log=load('fc.log',[]),snips=load('fc.snip',[]),busy=false;
let projects=load('fc.projects',null)||[{id:'default',name:'Default project',memory:'',files:{},chat:chat}];
let activeId=load('fc.active','default');
let project=projects.find(x=>x.id===activeId)||projects[0];activeId=project.id;chat=Array.isArray(project.chat)?project.chat:chat;
function persistProjects(){project.chat=chat;localStorage.setItem('fc.projects',JSON.stringify(projects));localStorage.setItem('fc.active',JSON.stringify(activeId))}
function switchProject(p){if(busy)return;persistProjects();project=p;activeId=p.id;chat=Array.isArray(p.chat)?p.chat:[];save();draw()}
function projectContext(){const files=Object.entries(project.files||{});let remaining=45000;const chunks=[];for(const [name,code] of files){if(remaining<=0){chunks.push('\nFILE: '+name+' (omitted — context full)');continue}let body=code;if(/^data:image\//i.test(code)){const keep=Math.min(code.length,Math.max(8000,Math.floor(remaining*0.5)));body='[PHOTO attached as data URL; first chars shown so you can reuse it in <img src=\"...\">]\n'+code.slice(0,keep);if(keep<code.length)body+='\n…(truncated)'}else{body=code.slice(0,Math.min(code.length,remaining))}const part='\nFILE: '+name+'\n```\n'+body+'\n```';chunks.push(part);remaining-=body.length}return 'PROJECT: '+project.name+'\nPERSISTENT PROJECT MEMORY / DECISIONS:\n'+(project.memory||'None yet')+'\nPROJECT FILES ('+files.length+', capped at 45k characters total):'+chunks.join('\n')+'\nKeep existing project decisions and files consistent. When modifying a file, return its FULL updated contents in a fenced code block with the EXACT relative filename as the fence label (example: ```index.html). Never use a bare ```html label. Never provide partial snippets as a full file. The user reviews and applies changes manually; do not claim files were saved automatically.'}

if(!Array.isArray(cfg.providers))cfg={...DEF,providers:DEF.providers.map(p=>({...p}))};
// Restore built-in providers removed by earlier versions, preserving existing keys and settings.
for(const standard of DEF.providers){
  if(!cfg.providers.some(p=>p.id===standard.id))cfg.providers.push({...standard});
}
// Migrate retired / unavailable model ids so saved keys start working again.
for(const p of cfg.providers){
  if(p.id==='gemini' && (!p.model || /gemini-2\.5-flash|gemini-flash-latest$/i.test(p.model)))p.model='gemini-flash-lite-latest';
  if(p.id==='groq' && (!p.model || /llama-3\.3-70b-versatile|llama-3\.1-8b-instant/i.test(p.model)))p.model='openai/gpt-oss-20b';
  if(p.id==='openrouter' && (!p.model || /llama-3\.3-70b-instruct:free|gemma-3|qwen3-8b:free/i.test(p.model)))p.model='openrouter/free';
  if(p.id==='cerebras' && p.model && /llama-3\.3-70b$/i.test(p.model))p.model='llama3.1-8b';
}
try{localStorage.setItem('fc.cfg',JSON.stringify(cfg))}catch(e){}
// Keep system prompt current for existing installs
if(!cfg.sys || cfg.sys.indexOf('ALWAYS force a dark theme')<0){
  if(!cfg.sys || cfg.sys.indexOf('Prefer complete, runnable single-file')>=0){cfg.sys=DEF.sys;try{localStorage.setItem('fc.cfg',JSON.stringify(cfg))}catch(e){}}
}

// Everything below is saved to localStorage so closing the page loses nothing.
function save(){try{
  localStorage.setItem('fc.cfg',JSON.stringify(cfg));localStorage.setItem('fc.chat',JSON.stringify(chat));persistProjects();
  localStorage.setItem('fc.cool',JSON.stringify(cool));localStorage.setItem('fc.log',JSON.stringify(log.slice(-200)));localStorage.setItem('fc.snip',JSON.stringify(snips));
}catch(e){}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const nm=id=>(cfg.providers.find(p=>p.id===id)||{name:id}).name;
function note(text){log.push({t:Date.now(),text});chat.push({role:'sys',content:text});save()}

async function readSSE(r,onData){
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
      if(line.startsWith('data:')){const s=line.slice(5).trim();if(s&&s!=='[DONE]'){try{onData(JSON.parse(s))}catch(e){}}}}}
}
async function call(p,msgs,onD){
  const stream=!!onD,gem=p.type==='gemini',base=p.url.replace(/\/$/,'');let r;
  try{
    if(gem){
      // Gemini rejects back-to-back messages with the same role; merge them.
      const contents=[];
      for(const m of msgs){
        const role=m.role==='assistant'?'model':'user';
        const text=m.content||'';
        if(contents.length && contents[contents.length-1].role===role)contents[contents.length-1].parts[0].text+='\n\n'+text;
        else contents.push({role,parts:[{text}]});
      }
      r=await fetch(base+'/models/'+encodeURIComponent(p.model)+(stream?':streamGenerateContent?alt=sse':':generateContent'),{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':p.key},body:JSON.stringify({systemInstruction:{parts:[{text:cfg.sys}]},contents})});
    }else{
      const headers={'Content-Type':'application/json','Authorization':'Bearer '+p.key};
      if(p.id==='openrouter'){headers['HTTP-Referer']=location.origin+location.pathname;headers['X-Title']='Free Coder Studio'}
      r=await fetch(base+'/chat/completions',{method:'POST',headers,body:JSON.stringify({model:p.model,stream,messages:[{role:'system',content:cfg.sys},...msgs]})});
    }
  }catch(e){throw{status:0,msg:'network/CORS error'}}
  if(!r.ok){let t='';try{t=await r.text()}catch(e){}
    let detail=t.slice(0,160);try{const j=JSON.parse(t);detail=(j.error&&(j.error.message||j.error))||j.message||detail}catch(e){}
    throw{status:r.status,retry:parseInt(r.headers.get('retry-after')||'0',10),msg:'HTTP '+r.status+' '+String(detail).slice(0,160)}}
  const piece=d=>{
    if(!gem)return (stream?d.choices?.[0]?.delta?.content:d.choices?.[0]?.message?.content)||'';
    const c=d.candidates?.[0];
    if(!c && d.promptFeedback)throw{status:400,msg:'Gemini blocked the prompt'};
    if(c && c.finishReason && /SAFETY|BLOCK/i.test(c.finishReason) && !(c.content?.parts||[]).length)throw{status:400,msg:'Gemini blocked: '+c.finishReason};
    return (c?.content?.parts||[]).map(x=>x.text||'').join('');
  };
  let out='';
  if(stream){
    if(!r.body)throw{status:0,msg:'streaming unsupported'};
    try{await readSSE(r,d=>{const t=piece(d);if(t){out+=t;onD(out)}})}catch(e){throw{status:0,msg:'stream interrupted'}}
  }else out=piece(await r.json());
  if(!out)throw{status:500,msg:'empty reply'};
  return out;
}
function coolFor(e){
  if(e.status===429)return Math.max(e.retry||0,90)*1000;
  if(e.status===401||e.status===403)return 3600e3;
  if(e.status===400||e.status===404)return 600e3;
  return 30e3;
}
function send(){
  const t=$('#inp').value.trim();if(!t||busy)return;
  $('#inp').value='';try{localStorage.removeItem('fc.draft')}catch(e){}
  chat.push({role:'user',content:t});save();run();
}
async function run(){
  if(busy)return;busy=true;
  while(chat.length&&chat[chat.length-1].role==='err')chat.pop();
  const n=cfg.providers.length;
  const order=cfg.providers.map((p,i)=>({p,i})).filter(x=>x.p.on&&x.p.key).sort((a,b)=>((a.i-cfg.cur+n)%n)-((b.i-cfg.cur+n)%n));
  if(!order.length){chat.push({role:'err',content:'Add at least one API key in Keys.'});busy=false;save();draw();return}
  const msgs=chat.filter(m=>m.role==='user'||m.role==='assistant').slice(-24);
   msgs.unshift({role:'user',content:'[PROJECT CONTEXT — persistent across provider switches]\n'+projectContext()});
  draw();
  const box=$('#msgs'),live=h('div',{class:'m assistant'},h('p',{textContent:'…'}));box.append(live);box.scrollTop=box.scrollHeight;
  const errs=[];let ok=false;
  for(const {p,i} of order){
    if((cool[p.id]||0)>Date.now()){errs.push(p.name+': cooling down');continue}
    status('Trying '+p.name+'…');
    try{
      const out=await call(p,msgs,t=>{live.firstChild.textContent=t;box.scrollTop=box.scrollHeight});
      if(cfg.last&&cfg.last!==p.id)note('Switched '+nm(cfg.last)+' → '+p.name);
      cfg.last=p.id;cfg.cur=cfg.mode==='rotate'?(i+1)%n:i;
      chat.push({role:'assistant',content:out,via:p.name+' · '+p.model});ok=true;save();break;
    }catch(e){
      cool[p.id]=Date.now()+coolFor(e);errs.push(p.name+': '+e.msg);
      note(p.name+' failed ('+e.msg.slice(0,60)+') — cooling '+Math.round(coolFor(e)/1000)+'s');
      live.firstChild.textContent='…';
    }
  }
  if(!ok){chat.push({role:'err',content:'All providers failed:\n'+errs.join('\n')});save()}
  busy=false;draw();
}

function idle(){
  const now=Date.now();
  status(cfg.providers.filter(p=>p.on&&p.key).map(p=>(cool[p.id]>now?'⏳ '+Math.ceil((cool[p.id]-now)/1000)+'s':'✓')+' '+p.name).join(' · ')||'No keys yet — tap Keys');

async function copy(t,b){try{await navigator.clipboard.writeText(t);b.textContent='Copied'}catch(x){b.textContent='Failed'}}
function isHtml(lang,code){return /(^|[\/.\s])html?\b/i.test(lang||'')||/^\s*<(!doctype|html|head|body|div|main|section)\b/i.test(code)}
function isImageData(content){return typeof content==='string'&&/^data:image\//i.test(content)}
function mimeFor(name,code){
  if(isHtml('',code)||/\.html?$/i.test(name))return 'text/html';
  if(/\.css$/i.test(name))return 'text/css';
  if(/\.js$/i.test(name))return 'text/javascript';
  if(/\.json$/i.test(name))return 'application/json';
  if(/^data:([^;,]+)/i.test(code||''))return RegExp.$1;
  return 'text/plain';
}
function proposedFilename(label,code){
  const raw=(label||'').trim().replace(/^file[:=]\s*/i,'').trim();
  if(/^[\w .@-]+(?:\/[\w .@-]+)*\.[a-z0-9]{1,12}$/i.test(raw)&&!raw.includes('..'))return raw;
  const lang=(raw.split(/[\s:{]/)[0]||'').toLowerCase();
  if(lang==='html'||lang==='htm'||isHtml(lang,code))return 'index.html';
  if(lang==='css')return 'styles.css';
  if(lang==='js'||lang==='javascript')return 'script.js';
  if(lang==='json')return 'data.json';
  if(lang==='md'||lang==='markdown')return 'README.md';
  if(lang==='svg'||/^\s*<svg[\s>]/i.test(code))return 'image.svg';
  return null;
}
function applyReview(filename,code){
  const old=Object.prototype.hasOwnProperty.call(project.files,filename)?project.files[filename]:null;
  const b=h('div',{class:'body'});
  b.append(fieldLabel(old===null?'Create new file: '+filename:'Review replacement for: '+filename));
  if(old!==null&&!isImageData(old))b.append(fieldLabel('CURRENT FILE ('+old.length+' characters)'),h('textarea',{class:'field fileedit',readOnly:true,value:old}));
  if(!isImageData(code))b.append(fieldLabel('PROPOSED FILE ('+code.length+' characters)'),h('textarea',{class:'field fileedit',readOnly:true,value:code}));
  else b.append(h('img',{src:code,alt:filename,style:'max-width:100%;border-radius:12px;margin:8px 0'}));
  const status=h('p',{class:'note',textContent:''});
  b.append(h('button',{class:'p',textContent:old===null?'Save to project files':'Replace in project files',onclick:()=>{
    if(old!==null&&!confirm('Replace '+filename+' with this version? A previous copy will be kept in file history.'))return;
    project.history=project.history||[];
    if(old!==null)project.history.push({name:filename,content:old,time:Date.now()});
    project.history=project.history.slice(-40);
    project.files[filename]=code;save();status.textContent='Saved to project files: '+filename;setTimeout(()=>{o.remove();draw()},600);
  }}),h('button',{textContent:'Download '+filename,onclick:()=>download(filename,code,mimeFor(filename,code))}),h('button',{textContent:'Cancel',onclick:()=>o.remove()}),status);
  const o=overlay('Save this file',b);
}
function codeBlock(lang,code){
  const filename=proposedFilename(lang,code);
  const label=filename||lang||'code';
  const html=isHtml(lang,code);
  const long=code.length>900 || (code.match(/\n/g)||[]).length>18;
  const wrap=h('div',{class:'cb'+(long?' collapsed':'')});
  const actions=h('div',{class:'actions'});
  if(html)actions.append(h('button',{class:'p',textContent:'Preview',onclick:()=>preview(code)}));
  if(filename)actions.append(h('button',{class:'p',textContent:'Save as '+filename,onclick:()=>applyReview(filename,code)}));
  else actions.append(h('button',{textContent:'Save to project…',onclick:()=>{
    const name=prompt('Filename to save as (e.g. index.html)','index.html');
    if(name)applyReview(name.trim(),code);
  }}));
  actions.append(
    h('button',{textContent:'Download',onclick:()=>download(filename||(html?'index.html':'snippet.txt'),code,mimeFor(filename||'',code))}),
    h('button',{textContent:'Copy',onclick:e=>copy(code,e.target)}),
    h('button',{textContent:'Keep snippet',onclick:e=>{snips.push({lang:filename||lang,code,t:Date.now()});save();e.target.textContent='Kept'}})
  );
  const hd=h('div',{class:'h'},h('span',{textContent:label}));
  if(long){
    const tog=h('button',{textContent:'Show code',onclick:()=>{
      const on=wrap.classList.toggle('collapsed');
      tog.textContent=on?'Show code':'Hide code';
    }});
    hd.append(tog);
  }
  hd.append(actions);
  wrap.append(hd,h('pre',{},h('code',{textContent:code.replace(/\n$/,'')})));
  return wrap;
}
function body(text){
  const f=document.createDocumentFragment();let last=0,m;const re=/```([^\n`]*)\n([\s\S]*?)```/g;
  const para=s=>{s=s.trim();if(s)f.append(h('p',{textContent:s}))};
  while((m=re.exec(text))){para(text.slice(last,m.index));f.append(codeBlock(m[1],m[2]));last=re.lastIndex}
  para(text.slice(last));return f;
}
function draw(){
  const box=$('#msgs');box.textContent='';
  if(!chat.length)box.append(h('div',{class:'note',textContent:'Freddy Free Coder: add free API keys under Keys, then ask for code. Use ＋ beside Send to attach photos or HTML. When code appears, Preview / Save stay at the top of the block. Chats, keys, and files stay on this phone.'}));
  chat.forEach(m=>{
    const d=h('div',{class:'m '+m.role});
    if(m.role==='assistant')d.append(body(m.content));else d.append(h('p',{textContent:m.content}));
    if(m.via)d.append(h('div',{class:'via',textContent:'via '+m.via}));
    box.append(d);
  });
  const lr=[...chat].reverse().find(m=>m.role!=='sys');
  if(!busy&&lr&&lr.role!=='assistant')box.append(h('button',{textContent:'Retry last message',onclick:run}));
  box.scrollTop=box.scrollHeight;idle();
}

function readFileForProject(f){
  return new Promise((resolve,reject)=>{
    if(f.size>2500000){reject(new Error(f.name+' is over 2.5MB'));return}
    const isImg=/^image\//.test(f.type)||/\.(png|jpe?g|gif|webp|heic)$/i.test(f.name);
    if(isImg){
      const reader=new FileReader();
      reader.onerror=()=>reject(new Error('Could not read '+f.name));
      reader.onload=()=>{
        const data=String(reader.result||'');
        // Shrink big photos so they fit in browser storage / chat context.
        if(data.length<=350000){resolve(data);return}
        const img=new Image();
        img.onload=()=>{
          const max=1280;let w=img.width,h=img.height;
          if(w>max||h>max){const s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s)}
          const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
          resolve(c.toDataURL('image/jpeg',0.72));
        };
        img.onerror=()=>resolve(data);
        img.src=data;
      };
      reader.readAsDataURL(f);
      return;
    }
    f.text().then(resolve,()=>reject(new Error('Could not read '+f.name)));
  });
}
function filesView(){
  const b=h('div',{class:'body'});let o;
  const status=h('p',{class:'note',textContent:''});
  const render=()=>{
    b.textContent='';
    b.append(fieldLabel('Upload photos, HTML pages, CSS, JS, or text. They stay on this phone in your browser and are sent with your chat so the AI can use them.'));
    b.append(status);
    const imp=h('input',{id:'fileImport',type:'file',multiple:true,accept:'image/*,.html,.htm,.css,.js,.json,.md,.txt,.svg,text/*',style:'display:none',onchange:async e=>{
      const files=[...e.target.files];e.target.value='';
      if(!files.length)return;
      status.textContent='Uploading…';
      const got=[];const skipped=[];
      for(const f of files){
        try{project.files[f.name]=await readFileForProject(f);got.push(f.name)}
        catch(err){skipped.push(err.message||f.name)}
      }
      save();
      status.textContent=(got.length?'Received: '+got.join(', '):'')+(skipped.length?(got.length?' · ':'')+'Skipped: '+skipped.join(', '):'');
      render();
    }});
    b.append(imp);
    b.append(h('button',{class:'p',textContent:'Upload photos or files',onclick:()=>imp.click()}),
      h('button',{textContent:'+ New blank file',onclick:()=>{const name=prompt('Filename (e.g. index.html)');if(!name)return;if(Object.hasOwn(project.files,name)){alert('File already exists');return}project.files[name]='';save();status.textContent='Received: '+name;edit(name)}}),
      h('button',{textContent:'File history / restore',onclick:()=>historyView()}));
    const names=Object.keys(project.files);
    if(!names.length)b.append(fieldLabel('No files yet. Tap Upload photos or files.'));
    names.forEach(name=>{
      const content=project.files[name];
      const row=h('div',{class:'fileitem'},h('span',{textContent:name+' · '+(isImageData(content)?'photo':'')+(isImageData(content)?'':content.length+' chars')}));
      if(isImageData(content))row.append(h('img',{src:content,alt:name,style:'width:56px;height:56px;object-fit:cover;border-radius:8px'}));
      row.append(
        h('button',{textContent:isImageData(content)?'View':'Edit',onclick:()=>edit(name)}),
        h('button',{textContent:'Download',onclick:()=>download(name,content,mimeFor(name,content))}),
        h('button',{textContent:'Delete',onclick:()=>{if(confirm('Delete '+name+'?')){delete project.files[name];save();status.textContent='Deleted '+name;render()}}})
      );
      b.append(row);
    });
  };
  const edit=name=>{
    b.textContent='';
    const content=project.files[name];
    b.append(fieldLabel(name),status);
    if(isImageData(content)){
      b.append(h('img',{src:content,alt:name,style:'max-width:100%;border-radius:12px;margin:8px 0'}),
        h('button',{textContent:'Download photo',onclick:()=>download(name,content,mimeFor(name,content))}),
        h('button',{textContent:'Back',onclick:render}));
      return;
    }
    const ta=h('textarea',{class:'field fileedit',value:content});
    b.append(ta,h('button',{class:'p',textContent:'Save file',onclick:()=>{project.files[name]=ta.value;save();status.textContent='Received: saved '+name;render()}}),h('button',{textContent:'Cancel',onclick:render}));
  };
  render();o=overlay('Project files',b);
}
function historyView(){
 const b=h('div',{class:'body'});const render=()=>{
 b.textContent='';const history=(project.history||[]).slice().reverse();
 if(!history.length)b.append(fieldLabel('No previous file versions yet. Versions are saved before AI replacements.'));
 history.forEach((entry)=>b.append(h('div',{class:'fileitem'},h('span',{textContent:entry.name+' — '+new Date(entry.time).toLocaleString()}),h('button',{textContent:'Restore',onclick:()=>{
 if(!confirm('Restore this version of '+entry.name+'?'))return;
 const current=project.files[entry.name];if(current!==undefined)project.history.push({name:entry.name,content:current,time:Date.now()});
 project.files[entry.name]=entry.content;save();o.remove();draw();
 }}),h('button',{textContent:'Export',onclick:()=>download(entry.name,entry.content,'text/plain')}))));
 };render();const o=overlay('File history',b);

function download(name,contents,mime){let url,revoke=false;if(typeof contents==='string'&&/^data:/i.test(contents)){url=contents}else{const blob=new Blob([contents],{type:mime||'text/plain'});url=URL.createObjectURL(blob);revoke=true}const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();if(revoke)setTimeout(()=>URL.revokeObjectURL(url),3000)}
function projectsView(){
 const b=h('div',{class:'body'});let o;
 const render=()=>{b.textContent='';b.append(fieldLabel('Switch projects without losing their conversations, files, or memory. Export backups regularly: browser storage can be cleared by Safari or private browsing.'));

 projects.forEach(p=>b.append(h('div',{class:'fileitem'},h('span',{textContent:p.name+(p.id===activeId?' (active)':'')}),h('button',{textContent:'Open',onclick:()=>{switchProject(p);o.remove()}}),h('button',{textContent:'Rename',onclick:()=>{const n=prompt('Project name',p.name);if(n){p.name=n;save();render()}}}),h('button',{textContent:'Delete',onclick:()=>{if(projects.length===1)return alert('Keep at least one project');if(confirm('Permanently delete '+p.name+'?')){projects=projects.filter(x=>x!==p);if(activeId===p.id)switchProject(projects[0]);save();render()}}}))));
 b.append(fieldLabel('Backup / restore (API keys are NOT included in backups)'));
 b.append(h('button',{class:'p',textContent:'Export all projects',onclick:()=>{persistProjects();download('free-coder-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({version:2,projects,snips},null,2),'application/json')}}));

function applyBgMode(mode){
  document.body.classList.remove('bg-dim','bg-off');
  if(mode==='dim')document.body.classList.add('bg-dim');
  if(mode==='off')document.body.classList.add('bg-off');
  const labels={show:'BG: show',dim:'BG: dim',off:'BG: hide'};
  $('#bBg').textContent=labels[mode]||'BG';
  try{localStorage.setItem('fc.bg',mode)}catch(e){}
}
(function(){
  let mode='show';
  try{mode=localStorage.getItem('fc.bg')||'show'}catch(e){}
  if(mode!=='dim'&&mode!=='off')mode='show';
  applyBgMode(mode);
})();
$('#bBg').onclick=()=>{
